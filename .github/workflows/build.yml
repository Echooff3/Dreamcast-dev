# GitHub Actions workflow for building the Dreamcast demo application.
# Uses the same KallistiOS toolchain Docker image as the Dev Container.

name: Build Dreamcast Demo

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Compile with KallistiOS toolchain
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Use the same image as the Dev Container so the build environment matches exactly.
    container:
      image: einsteinx2/dcdev-kos-toolchain:gcc-9

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Source the KOS environment and run make in a single shell so that all
      # KOS_* variables (KOS_BASE, KOS_CC, etc.) remain in scope for the build.
      - name: Build demo application
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          make all

      - name: Verify ELF file was produced
        run: |
          if [ ! -f dreamcast_demo.elf ]; then
            echo "ERROR: dreamcast_demo.elf was not created by the build." >&2
            exit 1
          fi
          echo "Build succeeded: dreamcast_demo.elf exists."

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-demo-elf
          path: dreamcast_demo.elf
          retention-days: 30

      # CDI creation: build a proper two-session self-boot CDI with an ISO9660
      # data track so that Flycast (and real hardware) recognises it as data,
      # not audio.  Passing a raw binary to cdi4dc produces a trackless data
      # section with no filesystem, which Flycast misidentifies as an audio CD.
      #
      # Correct pipeline:
      #   ELF → raw binary (objcopy) → 1ST_READ.BIN (scramble)
      #   + IP.BIN (makeip)
      #   → ISO9660 (genisoimage -C 0,11702 -G ip.bin)
      #   → CDI (cdi4dc <iso>)
      - name: Install CDI build dependencies
        run: |
          # The KOS toolchain image is Alpine-based; genisoimage is in the cdrkit package.
          apk add --no-cache cdrkit

      - name: Create CDI image
        id: cdi
        run: |
          . /opt/toolchains/dc/kos/environ.sh

          IPTMPL="$KOS_BASE/utils/makeip/IP.TMPL"

          if [ ! -f "$IPTMPL" ]; then
            echo "IP.TMPL not found at $IPTMPL; skipping CDI image."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! command -v cdi4dc > /dev/null 2>&1; then
            echo "cdi4dc not found; skipping CDI image."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Step 1: extract raw binary from the ELF
          sh-elf-objcopy -O binary dreamcast_demo.elf dreamcast_demo.bin

          # Step 2: scramble for Dreamcast self-boot CD
          "$KOS_BASE/utils/scramble/scramble" dreamcast_demo.bin 1ST_READ.BIN

          # Step 3: use IP.TMPL directly as the boot sector.
          # IP.TMPL is the default KOS IP.BIN template — all fields are pre-filled
          # with standard homebrew defaults, so makeip is not needed for a demo.
          cp "$IPTMPL" ip.bin

          # Step 4: build the ISO9660 disc image.
          # -C 0,11702  sets the correct multi-session LBA offset for Dreamcast.
          # -G ip.bin   injects IP.BIN as the boot sector.
          mkdir -p disc
          cp 1ST_READ.BIN disc/
          genisoimage -C 0,11702 -V "DREAMCAST" -G ip.bin \
            -r -J -l -o data.iso disc/

          # Step 5: wrap the ISO into a CDI.
          # Passing the ISO (not the raw binary) gives cdi4dc a proper ISO9660
          # data track that Flycast recognises as a data disc.
          cdi4dc data.iso dreamcast_demo.cdi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload CDI artifact
        if: steps.cdi.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-demo-cdi
          path: dreamcast_demo.cdi
          retention-days: 30
